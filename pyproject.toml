[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "osint-recon-studio"
version = "1.4.1"
description = "Native Windows GUI for strictly passive OSINT, domain attack surface auditing, and personal privacy exposure analysis"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Principal Windows Desktop Architect & Senior Security Engineer" }
]
keywords = ["osint", "reconnaissance", "security", "privacy", "dns", "rdap", "attack-surface", "pyside6", "qt"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "PySide6>=6.6.0",
    "httpx>=0.27.0",
    "h2>=4.1.0",
    "dnspython>=2.6.0",
    "pypdf>=5.0.0",
    "Pillow>=10.0.0",
    "certifi>=2024.0.0",
    "idna>=3.7",
    "phonenumbers>=8.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyinstaller>=6.5.0",
]

[project.scripts]
osint-recon-studio = "osint_studio.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
